# slug = nazwa kraju w API małymi literami; from-year = pierwszy sezon (rok startu).
# leagues = id lig od najwyższego poziomu, names = ich nazwy (lista w zakładce Scraper),
# tiers = poziom każdej ligi, gdy kilka lig jest na tym samym poziomie (np. Apertura i Clausura).
